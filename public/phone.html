<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frog Drop - Play</title>
  <link rel="stylesheet" href="css/phone.css">
</head>
<body>

  <!-- Join Screen -->
  <div id="join-screen">
    <div class="phone-logos">
      <img src="images/crest-logo.png" alt="Crest Secondary" class="phone-logo">
      <img src="images/weeswares-logo.png" alt="WeesWares" class="phone-logo">
    </div>
    <h1>Frog Drop</h1>

    <!-- Shown when joining via QR code (room code already known) -->
    <div id="qr-join" style="display:none;">
      <p class="subtitle">You're joining the game!</p>
      <p class="room-badge">Room: <span id="qr-room-code"></span></p>
      <label for="name-input-qr">Enter Your Name</label>
      <input type="text" id="name-input-qr" placeholder="e.g. Grandma" maxlength="16" autocomplete="off" autofocus>
      <button id="join-btn-qr" class="join-btn-big">Join Game</button>
      <p id="join-error-qr" class="join-error"></p>
    </div>

    <!-- Shown when opening page without QR code (manual entry) -->
    <div id="manual-join">
      <p class="subtitle">Enter the room code shown on the TV</p>
      <label for="name-input">Your Name</label>
      <input type="text" id="name-input" placeholder="e.g. Grandma" maxlength="16" autocomplete="off">
      <label for="room-code-input">Room Code</label>
      <input type="text" id="room-code-input" placeholder="ABCD" maxlength="4" autocomplete="off">
      <button id="join-btn">Join Game</button>
      <p id="join-error" class="join-error"></p>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen">

    <div class="info-bar">
      <span class="player-name" id="display-name">Player</span>
      <span class="timer-display">Time: <span id="timer-value">90</span>s</span>
      <span class="score-display">Score: <span id="score-value">0</span></span>
    </div>

    <!-- Board canvas with drag zone at top -->
    <canvas id="phone-board-canvas"></canvas>

    <!-- Action buttons -->
    <div class="action-buttons">
      <button class="action-btn undo-btn" id="undo-btn">Undo</button>
      <button class="action-btn restart-btn" id="restart-btn">Restart</button>
    </div>

    <!-- Frog evolution legend -->
    <div class="legend">
      <h3>Frog Legend</h3>
      <div class="legend-row" id="legend-row"></div>
    </div>
  </div>

  <!-- Game over overlay -->
  <div class="game-over-overlay" id="game-over-overlay">
    <h2>Game Over!</h2>
    <p class="final-score" id="final-score">Score: 0</p>
    <p class="best-score-display" id="best-score-display">Best: 0</p>
    <button id="restart-overlay-btn">Play Again</button>
  </div>

  <script src="js/game-logic.js"></script>
  <script src="js/frog-renderer.js"></script>
  <script src="js/sound-fx.js"></script>
  <script src="js/phone.js"></script>
</body>
</html>
