<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frog Drop - TV Screen</title>
  <link rel="stylesheet" href="css/tv.css">
</head>
<body>

  <!-- Lobby: shows room code, waiting for players -->
  <div id="lobby">
    <!-- Logos side by side -->
    <div class="logos">
      <img src="images/crest-logo.png" alt="Crest Secondary" class="logo">
      <img src="images/weeswares-logo.png" alt="WeesWares" class="logo">
    </div>

    <h1>Frog Drop</h1>
    <p class="subtitle">Scan the QR code or enter the room code on your phone!</p>

    <div class="join-info">
      <div class="qr-section">
        <img id="qr-code" alt="QR Code" class="qr-code">
        <p class="qr-label">Scan to join</p>
      </div>
      <div class="code-section">
        <p class="code-label">Room Code</p>
        <div id="room-code-display">----</div>
        <p class="join-url" id="join-url"></p>
      </div>
    </div>

    <p id="player-count">Waiting for players...</p>
    <p id="player-names"></p>
  </div>

  <!-- Game area: canvas showing all boards -->
  <div id="game-area">
    <div id="room-code-corner">
      <div class="corner-logos">
        <img src="images/crest-logo.png" alt="Crest" class="corner-logo">
        <img src="images/weeswares-logo.png" alt="WeesWares" class="corner-logo">
      </div>
      Room: <span id="corner-code"></span>
    </div>
    <div id="tv-timer">
      <span id="tv-timer-value">90</span>s
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="leaderboard">
      <h3>Leaderboard</h3>
      <div id="lb-list"></div>
      <button id="new-round-btn" class="new-round-btn" style="display:none;">New Round</button>
    </div>
  </div>

  <script src="js/game-logic.js"></script>
  <script src="js/frog-renderer.js"></script>
  <script src="js/sound-fx.js"></script>
  <script src="js/tv.js"></script>
</body>
</html>
